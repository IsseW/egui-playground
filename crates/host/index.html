<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
        <title>egui playground</title>

        <link
            data-trunk
            rel="rust"
            data-cargo-profile-release="small"
            data-wasm-opt="2"
            data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
        />
        <link data-trunk rel="copy-dir" href="public" />
        <link data-trunk rel="icon" href="data/egui_logo.png" />

        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
                width: 100%;
                overflow: hidden;
                background: #0b0b0c;
            }

            canvas {
                display: block;
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }
        </style>
    </head>

    <body>
        <canvas id="playground_canvas"></canvas>

        <!-- Defines window.compileRust and window.checkRust, which the host calls. -->
        <script type="module" src="public/runner.js"></script>
    </body>
</html>
