[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Fetches, verifies and stages the pinned browser compiler artifacts"

[dependencies]
anyhow = "1"
sha2 = "0.10"
serde_json = "1"
tar = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }
zstd = "0.13"
