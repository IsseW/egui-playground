[workspace]
members = [
  "crates/pg-abi",
  "crates/egui_playground",
  "crates/guest-examples",
  "crates/host",
  "toolchain",
  "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
egui = { version = "0.36", default-features = false }
pg-abi = { path = "crates/pg-abi" }
egui_playground = { path = "crates/egui_playground" }

[profile.release]
opt-level = 2

# Profile for the `host` web build. `toolchain/build-sysroot.sh` builds the shipped rlibs with `release`.
[profile.small]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
